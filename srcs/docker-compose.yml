services:
  mariadb:
    build:
      context: requirements/mariadb
    image: mariadb
    container_name: mariadb
    networks:
      - inception-network
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_ADMIN_PASSWORD_FILE: /run/secrets/db_admin_password
      MYSQL_USER_PASSWORD_FILE: /run/secrets/db_user_password
      MYSQL_WP_PASSWORD_FILE: /run/secrets/db_wp_password
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ADMIN: ${MYSQL_ADMIN}
      MYSQL_WORDPRESS: ${MYSQL_WORDPRESS}
    secrets:
      - db_admin_password
      - db_user_password
      - db_wp_password
      - db_root_password
    

  wordpress:
    build:
      context: requirements/wordpress
    image: wordpress
    container_name: wordpress
    depends_on:
      - mariadb
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    environment:
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_wp_password
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      MYSQL_WORDPRESS: ${MYSQL_WORDPRESS}
      DOMAIN_NAME: ${DOMAIN_NAME}
    secrets:
      - db_wp_password
    

  nginx:
    build:
      context: requirements/nginx
    image: nginx
    container_name: nginx
    depends_on:
      - wordpress
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    

networks:
  inception-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

secrets:
  db_admin_password:
    file: ../secrets/db_admin_password.txt
  db_user_password:
    file: ../secrets/db_user_password.txt
  db_wp_password:
    file: ../secrets/db_wp_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt