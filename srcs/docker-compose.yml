services:
  mariadb:
    build:
      context: requirements/mariadb
    image: mariadb:v1
    container_name: mariadb
    networks:
      - inception-network
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_root_pass
      - db_wp_pass
    restart: unless-stopped

  wordpress:
    build:
      context: requirements/wordpress
    image: wordpress:v1
    container_name: wordpress
    depends_on:
      - mariadb
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    secrets:
      - db_wp_pass
      - wp_admin_pass
      - wp_basic_pass
    restart: unless-stopped
    

  nginx:
    build:
      context: requirements/nginx
    image: nginx:v1
    container_name: nginx
    depends_on:
      - wordpress
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "443:443"
    env_file:
      - .env
    restart: unless-stopped
    

networks:
  inception-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

secrets:
  db_root_pass:
    file: ../secrets/db_root_pass.txt
  db_wp_pass:
    file: ../secrets/db_wp_pass.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_pass.txt
  wp_basic_pass:
    file: ../secrets/wp_basic_pass.txt

