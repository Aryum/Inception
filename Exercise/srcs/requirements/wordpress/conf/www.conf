; defines name of our PHP-FPM pool can be anything else
[www]
user = www-data
group = www-data
listen = 9000
; mostly useful when running unix socket for local acess
listen.owner = www-data
listen.group = www-data
; process management
; tells the PHP-FPM how to manage it workers
; could be 
;	static (always run x) 
;	dynamic (keep some ready but create more if needed) 
;	ondemand (just have some workers if needed keep none up)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3


