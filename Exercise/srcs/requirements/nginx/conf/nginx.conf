user ww-data;
daemon off;

#configures how worker processes handle connections at low level
events
{
	worker_connections 1024; #sets the max connections a sinle nginx worker process can hold
}

#configures how it handles http/https trafic
http
{
	include /etc/nginx/mime.types; #default setting file that aps file extensions to MIME (multipurpose internet mail extensions) types
	default_type application/octet-stream; #default fallback if extension is not found on MIME, application/octet-stream tells the broswer that its binary data and just donwload it instead of trying to render

	#catches insecure traffic and redirect to HTTPS
	server
	{
		listen 80;
		server_name ${DOMAIN_NAME};
		return 301 https://$host$request_uri; # instead of sercing thing redirects everything to the https version perserving paths it being 301 means its permanet redirect
	}

	server
	{
		listen 443 ssl http2; #terminates the tls connection, decrypts the connection and enables http/2 for better performance
		server_name ${DOMAIN_NAME};

		#sets keys and certificate paths and restricts protocos to those tls versions
		#sets the algorihtms for encryptions keys exchange and authentication
		ssl_certificate /etc/nginx/ssl/nginx.crt;
		ssl_certificate_key /etc/nginx/ssl/nginx.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;


		#check claude last char after ssl/tls setup
	}
}