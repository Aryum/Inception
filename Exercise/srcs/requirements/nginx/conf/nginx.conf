user www-data;
daemon off;

#configures how worker processes handle connections at low level
events
{
	worker_connections 1024; #sets the max connections a sinle nginx worker process can hold
}

#configures how it handles http/https trafic
http
{
	include /etc/nginx/mime.types; #default setting file that aps file extensions to MIME (multipurpose internet mail extensions) types

	server
	{
		listen 443 ssl http2; #terminates the tls connection, decrypts the connection and enables http/2 for better performance
		server_name ${DOMAIN_NAME};

		#sets keys and certificate paths and restricts protocos to those tls versions
		#sets the algorihtms for encryptions keys exchange and authentication
		ssl_certificate /etc/nginx/ssl/nginx.crt;
		ssl_certificate_key /etc/nginx/ssl/nginx.key;
		ssl_protocols TLSv1.2 TLSv1.3;

		#filesystem dir with the website files
		root /var/www/html;
		#when requesting a directory instead of a specific file where should nginx look for it
		#	will try them in order if its not found in the first one
		index index.php;

		#caps the size of requests bodies(files and other)
		client_max_body_size 64M;

		#routing within the server
		#	tells nginx how to handle requests for specific url patern
		#	there are multiple ways to define these patterns 
		
		#all requests automatically go through this since its only /
		# URI uniform resource identifier (small string that ids something in network or web)
		#	tries to find exact file requested
		#	then tries to the file in a folder with the same name
		#	then if nothing works go back do Wordpress router
		location / 
		{
			try_files $uri $uri/ /index.php?$args;
		}

		#any uri that ends in .php (case sensitive)
		location ~ \.php
		{
			fastcgi_pass wordpress:9000;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			#they are used to correctly oass request into PHPFPM, it teels what script to execute
		}
	}
}